sanity_tests_to_run:
    config: {}
    paths:
        - "{geosaurus_dir}/tests/sanity/**/*.py"
unit_tests_to_run:
    config: {}
    paths:
        - "{geosaurus_dir}/tests/unit/**/*.py"
integration_tests_to_run:
    config:
        blacklist:
            - "{geosaurus_dir}/tests/integration/**/_*.py"
    paths:
        - "{geosaurus_dir}/tests/integration/**/*.py"
nbconvert_notebook_tests_to_run:
    config:
        blacklist_regexes: 
            - ".*ipynb_checkpoints.*"
        cell_timeout_sec:
            300
        setup_script: "{arcgis_python_api_dir}/misc/setup.py"
        teardown_script: "{arcgis_python_api_dir}/misc/teardown.py"
    paths:
        - "{geosaurus_dir}/tests/notebook/**/*.ipynb"
        - "{arcgis_python_api_dir}/samples/**/*.ipynb"
        - "{arcgis_python_api_dir}/guide/**/*.ipynb"
selenium_notebook_tests_to_run:
    config:
        blacklist_regexes: 
            - ".*ipynb_checkpoints.*"
        cell_timeout_sec:
            300
    paths:
        - "{geosaurus_dir}/tests/widget/**/*.ipynb"
widget_unit_tests_to_run:
    config: {}
    paths:
        - "{geosaurus_dir}/tests/widget/**/*.js"
