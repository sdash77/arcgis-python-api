unit_tests_to_run:
    config:
        blacklist:
            - "{geosaurus_dir}/tests/integration/**/_*.py"
    paths:
        - "{geosaurus_dir}/tests/unit/**/*.py"
integration_tests_to_run:
    config:
        blacklist:
            - "{geosaurus_dir}/tests/integration/**/_*.py"
    paths:
        - "{geosaurus_dir}/tests/integration/server_tests/service_factory_test.py"
nbconvert_notebook_tests_to_run:
    config:
        blacklist:
            - "{geosaurus_dir}/tests/notebook/**/*ipynb_checkpoint*/**/*"
            - "{arcgis_python_api_dir}/tests/notebook/**/*ipynb_checkpoint*/**/*"
        cell_timeout_sec:
            300
        setup_script: "{arcgis_python_api_dir}/misc/setup.py"
        teardown_script: "{arcgis_python_api_dir}/misc/teardown.py"
    paths:
        - "{geosaurus_dir}/tests/dir/notebooks/nbconvert/aggregate_points_test.ipynb"
selenium_notebook_tests_to_run:
    config:
        blacklist:
            - "{geosaurus_dir}/tests/widget/integration/automated/**/*ipynb_checkpoint*/**/*"
        cell_timeout_sec:
            300
        browser:
            "dayofweek"
    paths: [] 
widget_unit_tests_to_run:
    config: {}
    paths:
        - "{geosaurus_dir}/tests/widget/**/*.js"
