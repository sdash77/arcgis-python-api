[workspace]
authors = ["Jay Roebuck <jroebuck@esri.com>"]
channels = ["esri-build", "esri", "main"]
channel-priority = "disabled"
name = "geosaurus_dev_env"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
pip = "*"
setuptools = "*"
azure-storage-blob = "<=12.9"
cachetools = "*"
certifi = "*"
cryptography = "*"
dask = ">=2024.12.1,<2025.1.0"
gdal = ">=3.6.2,<4"
geomet = "*"
keyring = ">=23.3.0"
lxml = "*"
matplotlib = "*"
matplotlib-inline = "*"
nbconvert = "*"
networkx = ">=3.3,<4"
numpy = ">=2.2.0,<3"
pandas = ">=2.0.0,<2.3.0"
pillow = "*"
puremagic = ">=1.15,<2"
pyarrow = ">=16,<20"
pylerc = "*"
pyspnego = ">=0.8.0"
pydantic = ">=2.8.2,<3"
requests = ">=2.32.3,<3"
requests-gssapi = "*"
requests-kerberos = "*"
requests-oauthlib = "*"
requests-toolbelt = "*"
truststore = ">=0.10.0"
ujson = ">=3"
urllib3 = ">=2.1.0,<3"
websocket-client = ">=1.2.3,<2"
anywidget = "==0.9.13"
ipywidgets = ">=8.0.0"
jupyterlab = ">=4.0.7,<5"
black = "*"
"keyrings.alt" = "*"
selenium = "*"
protobuf = "*"

[pypi-dependencies]
sphinx = ">=7, <8"
sphinx-rtd-theme = ">=2, <3"
autodoc-pydantic = ">=2, <3"
coverage = "*"
nose2 = "*"
parameterized = "*"
requests-mock = "*"
unittest-xml-reporting = "*"
