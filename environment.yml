name: geosaurus_dev_env
channels:
- defaults
- esri
- esri-build
# Dependencies to run ./src locally, and run unit and integration tests
# Building docs requires using pixi docs environment (e.g. `pixi shell --environment docs` or `pixi run docs`)
# Please consider migrating to pixi for local development
# See https://pixi.sh for more information
dependencies:
- python 3.13.*
- pip
- setuptools
# ---- arcgis ----
- azure-storage-blob <=12.9
- cachetools
- certifi
- cryptography
- dask >=2024.12.1,<2025.1.0
- gdal >=3.6.2, <4
- geomet >=1.0.0
- keyring>=23.3.0
- lxml
- matplotlib
- matplotlib-inline
- nbconvert
- networkx >=3.3, <4
- numpy >=2.2.0,<3
- pandas >=2.0.0,<2.4.0
- pillow
- puremagic >=1.15,<2
- pyarrow >=16,<20
- pylerc
- pyspnego >=0.8.0
- pydantic >=2.8.2, <3
# environment.yml does not support platform-specific dependencies
# use pixi or manually install these
# - pywin32-security
- requests >=2.32.3,<3
- requests-gssapi
- requests-kerberos
- requests-oauthlib
- requests-toolbelt
- truststore >=0.10.0
- ujson >=3
- urllib3 >=2.1.0,<3
- websocket-client >=1.2.3,<2
# ---- arcgis-mapping ----
- anywidget 0.9.13
- ipywidgets >=8.0.0
- jupyterlab >=4.0.7,<5
# ---- etc ----
- black
- keyrings.alt
- selenium
- protobuf
- pip:
  # ---- sphinx/docs build ----
  - sphinx >=8,<9
  - sphinx_rtd_theme>=3,<4
  - autodoc_pydantic>=2,<3
  # ---- automated testing ----
  - coverage
  - nose2
  - parameterized
  - requests-mock
  - unittest-xml-reporting
