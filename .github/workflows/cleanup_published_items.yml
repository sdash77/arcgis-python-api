name: Cleanup Published Items
on:
  workflow_dispatch:
    inputs:
      gis_profile:
        description: "To report and delete items or report only"
        required: true
        type: str
      day-difference:
        description: "How many days before 'now' to look for items"
        required: false
        default: 7
        type: number
      dry_run:
        description: "To report and delete items or report only"
        required: false
        default: true
        type: boolean

  schedule:
    # Run every day at 4AM UTC
    - cron: '8 0 * * *'
jobs:
  cleanup-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          environments: >-
            local
          frozen: true
      - name: Run cleanup job
        env:
          GIS_PROFILE: ${{ inputs.gis_profile }}
          DAY_DIFFERENCE: ${{ inputs.day_difference || 7 }}
          TEST_ONLY: ${{ inputs.dry_run || true }}
        run: python cleanup_published_items.py --day_difference=$DAY_DIFFERENCE --dry_run=$TEST_ONLY