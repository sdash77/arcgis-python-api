name: Cleanup Published Items
on:
  workflow_dispatch:
    inputs:
      gis_profile:
        description: "The GIS profile name (e.g your_enterprise_profile)"
        required: true
        type: string
      day-difference:
        description: "How many days before 'now' to look for items"
        required: false
        default: 7
        type: number
      dry_run:
        description: "To report and delete items or report only"
        required: false
        default: true
        type: boolean
jobs:
  cleanup-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          environments: >-
            local
          frozen: true
          activate-environment: true
      - name: Generate GIS profiles
        run: pixi run test:config:profiles
      - name: Run cleanup job
        run: python tests/utils/cleanup_published_items.py --gis_profile=${{ inputs.gis_profile }} --day_difference=${{ inputs.day_difference || 7 }} --dry_run=${{ inputs.dry_run || true }}