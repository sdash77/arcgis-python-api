name: Cleanup Published Items
on:
  workflow_dispatch:
  schedule:
    # Run every day at 4AM UTC
    - cron: '8 0 * * *'
jobs:
  cleanup-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          environments: >-
            local
          frozen: true
      - name: Run cleanup job
        run: python -m cleanup_published_items.py
