name: Check code formatting
on:
  pull_request:
    branches: [ master ]

jobs:
  black-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: psf/black@stable
        with:
          options: --check --verbose
          src: ./src