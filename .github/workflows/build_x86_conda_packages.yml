name: Python Package using Conda for x86 (32-bit)

on: [workflow_dispatch]

jobs:
  build-x86:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
         os: [ubuntu-latest, windows-latest]
         python-version: ['3.9']
      max-parallel: 5

    steps:
    - uses: actions/checkout@v2.1.1
    - uses: conda-incubator/setup-miniconda@v2.1.1
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        architecture: x86
    - name: Install dependencies using Miniconda
      run: |
        conda install conda-build python=${{ matrix.python-version }}
        conda install pyyaml
    - name: Install pyyaml for pip 
      if: contains(matrix.os, 'macos')
      run: |
        echo "Using Pip to install pyyaml"
        conda install pyyaml
        pip install pyyaml
        echo "Finished"
    - name: Update the Meta.yaml File
      run: |
        cd ./build
        python update_build_number.py "${{ github.run_number }}" "./arcgis/meta.yaml"
    - name: Clean PYD/SO Files and Folders
      run: |
        python ./build/clean_up_so_pyd.py "./src"
    - name: Install Conda-Build
      run: |
        cd ./build
        ls
        mkdir output_build
        conda build --croot ./output_build -c esri -c Esri-build arcgis
    - name: check folder
      run: |
        cd ./build/output_build
        ls
    - uses: actions/upload-artifact@v2  
      with:
        name: conda-build-${{ matrix.os }}-${{matrix.python-version}}-${{ github.sha }}
        path: build/output_build/**/*.tar.bz2
        retention-days: 10
