name: Performance Test
on:
  workflow_dispatch:
  schedule:
    # Every day at 12:30 PM UTC
    - cron: '30 12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: geosaurus
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          manifest-path: geosaurus/pixi.toml
          environments: >-
            local
          frozen: true
      - run: |
            cd geosaurus && pixi run -e local test:performance