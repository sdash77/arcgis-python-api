name: arcgis-learn-api-confidence-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  paths:
      - 'src/arcgis/learn/**'
      - 'tests/integration/arcgis_learn/**'
      
permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-pull_request:
    runs-on: self-hosted

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: run tests in conda env
        run: |
          PYTHON=/root/anaconda3/envs/jenkins_03_April_25/bin/python
          echo "Python Version:"
          $PYTHON --Version

          echo "Inside directory"
          pwd
          
