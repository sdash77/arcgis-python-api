name: arcgis-learn-api-confidence-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/arcgis/learn/**'
      - 'tests/integration/arcgis_learn/**'
  workflow_dispatch:
    inputs:
      env_name:
        description: "Name of Conda environment"
        required: false
        default: "jenkins_03_April_25"
      test_file:
        description: "Path to test file"
        required: false
        default: "tests/integration/arcgis_learn/test_common.py"

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-pull_request:
    runs-on: self-hosted

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run tests in arcgis_learn supported conda env - Linux
        run: |
          ENV_NAME="${{ github.event.inputs.env_name || 'jenkins_03_April_25' }}"
          TEST_FILE="${{ github.event.inputs.test_file || 'tests/integration/arcgis_learn/test_common.py' }}"
          PYTHON="/root/anaconda3/envs/$ENV_NAME/bin/python"

          echo "Python Version:"
          $PYTHON --version

          echo "Working directory"
          pwd

          echo "Setting up required environment variables"
          WORKSPACE=$(pwd)
          echo "copy KNN file"
          scp "/root/test_automation/dlls/nearest_neighbors.cpython-311-x86_64-linux-gnu.so" "$WORKSPACE/src/arcgis/learn/_utils/nearest_neighbors.cpython-311-x86_64-linux-gnu.so"
          echo "File copied to $WORKSPACE/src/arcgis/learn/_utils"

          export LC_ALL=en_US.UTF-8
          export LC_CTYPE=en_US.UTF-8
          export run_nightly=0
          export run_inference=0
          export run_weekly=0
          export run_backbones=0
          export TESTFOLDERPATH="$WORKSPACE/tests"
          export PYTHONPATH="$WORKSPACE/tests"

          REPORT_FILE=$WORKSPACE/tests/_output/test-results.xml

          echo "============================="
          echo "TEST SCRIPT STARTS"
          "$PYTHON" -m pytest "$TEST_FILE" -v -s --color=yes --junit-xml="$REPORT_FILE" --disable-warnings

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/tests/_output/test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - arcgis.learn API
          path: ${{ github.workspace }}/tests/_output/test-results.xml
          reporter: java-junit
          fail-on-error: false
