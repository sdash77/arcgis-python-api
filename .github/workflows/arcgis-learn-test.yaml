name: arcgis-learn-api-confidence-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-pull_request:
    runs-on: self-hosted

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        uses: tj-actions/changed-files@v41
        id: changes
        with:
          files: |
            src/arcgis/learn/**
            tests/integration/arcgis_learn/**

      - name: Skip if no relevant files changed
        if: steps.changes.outputs.any_changed != 'true'
        run: echo "No relevant files changed."

      - name: api-confidence-tests
        if: steps.changes.outputs.any_changed == 'true'
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -e
          crumb=$(curl -s -u "$JENKINS_USER:$JENKINS_API_TOKEN" "$JENKINS_URL/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)")

          queue_url=$(curl -s -i -X POST "$JENKINS_URL/job/learn_pr_tests_github_actions/buildWithParameters" \
            -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -H "$crumb" \
            --data-urlencode "PR_BRANCH=${{ github.event.pull_request.head.ref }}" \
            --data-urlencode "PR_SHA=${{ github.event.pull_request.head.sha }}" \
            | grep -i Location | awk '{print $2}' | tr -d '\r')

          if [ -z "$queue_url" ]; then
            echo "Failed to trigger Jenkins job"
            exit 1
          fi

          echo "Jenkins job triggered. Queue URL: $queue_url"

          echo "Jenkins queue URL: $queue_url"
          if [[ -z "$queue_url" ]]; then
            echo "Failed to trigger Jenkins build"
            exit 1
          fi
          # Poll the Jenkins queue to get the build number
          echo "Waiting for Jenkins to start the build..."
          for i in {1..30}; do
            build_number=$(curl -s "$queue_url/api/json" \
              -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
              | grep -o '"number":[0-9]*' | grep -o '[0-9]*')
            if [[ -n "$build_number" ]]; then
              echo "Jenkins build started with number: $build_number"
              break
            fi
            sleep 5
          done
          if [[ -z "$build_number" ]]; then
            echo "Timed out waiting for Jenkins build to start"
            exit 1
          fi
          # Poll the Jenkins job status
          echo "Polling Jenkins build result..."
          for i in {1..60}; do
            result=$(curl -s "$JENKINS_URL/job/learn_pr_suraj/$build_number/api/json" \
              -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
              | grep -o '"result":"[^"]*"' | cut -d'"' -f4)
            if [[ "$result" != "null" && -n "$result" ]]; then
              echo "Jenkins build completed with result: $result"
              break
            fi
            sleep 10
          done
          # Exit the GitHub Action with failure if Jenkins build failed
          if [[ "$result" != "SUCCESS" ]]; then
            echo "Jenkins build failed or was not successful"
            exit 1
          else
            echo "Jenkins build succeeded"
          fi
