name: Pixi Update
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    types:
    - completed

jobs:
    pixi-lock-daily:
      if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          frozen: false
          run-install: false
      - run: |
            pixi update -e daily arcgis
            pixi update -e daily arcgis-mapping
      - run: |
            git config --global user.name "github-action [bot]"
            git config --global user.email "arcgis@users.noreply.github.com"
            git add pixi.lock
            git commit -m "[Automated] Update pixi.lock for daily environment"
            git push
