name: Unit Test
on:
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            binary-os: linux
          - os: macos-latest
            binary-os: linux
          - os: windows-latest
            binary-os: windows
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/checkout@v4
        with:
          ref: binaries/main
          path: binaries
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Get conda environment path
        id: conda-info
        run: |
          echo "conda-env-path=$CONDA_PREFIX" >> $GITHUB_OUTPUT
      - name: Get arcgis release info
        id: arcgis-info
        run: |
          echo "latest-version=$(conda search -c esri arcgis --json | jq -r '[ .[][].version] | max')" >> $GITHUB_OUTPUT
      - name: Load Cache
        id: restore-cache
        uses: actions/cache/restore@v3
        with:
          path: ${{ steps.conda-info.outputs.conda-env-path }}
          key: conda-${{ matrix.os }}-py${{ matrix.python-version }}-arcgis${{ steps.arcgis-info.outputs.latest-version }}-${{ hashFiles('.github/workflows/unit-test.yaml', 'environment.yml', 'build/arcgis/meta.yaml', 'src/requirements.txt', 'src/setup.py') }}
          restore-keys: |
            conda-${{ matrix.os }}-py${{ matrix.python-version }}-arcgis${{ steps.arcgis-info.outputs.latest-version }}-
      - name: Install dependencies
        run: |
          conda install -c main nose2 --yes
          conda install -c esri arcgis=${{ steps.arcgis-info.outputs.latest-version }} --only-deps --yes
          conda install -c esri "pandas>=2.0,<2.1" # See https://github.com/ArcGIS/geosaurus/issues/10966
          conda install -c esri-build pydantic --yes
          conda install -c esri-build puremagic --yes
          conda install -c main "pyarrow>=11" --yes
        if: steps.restore-cache.outputs.cache-hit != 'true'
      - name: Show conda environment
        run: |
          conda list
          conda info
      - name: Save Cache
        id: save-cache
        uses: actions/cache/save@v3
        with:
          path: ${{ steps.conda-info.outputs.conda-env-path }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
        if: steps.restore-cache.outputs.cache-hit != 'true'
      - name: Install arcgis
        run: |
          # copy binaries to relevant paths
          cp ./binaries/${{ matrix.binary-os }}/py${{ matrix.python-version }}/graph/* ./src/arcgis/graph
          cp ./binaries/${{ matrix.binary-os }}/py${{ matrix.python-version }}/knn/* ./src/arcgis/learn/_utils
          cp ./binaries/${{ matrix.binary-os }}/py${{ matrix.python-version }}/tracking-engine/* ./src/arcgis/learn/_tracking

          python -m pip install -e ./src --no-deps
      - name: Run smoke tests
        working-directory: ./tests
        run: |
          python -m nose2 -s smoke --plugin nose2.plugins.junitxml --junit-xml --junit-xml-path=smoke_py${{ matrix.python-version }}_${{ runner.os }}_testreport.xml
        env:
          TEST_ARCGIS_LEARN: false
      - name: Run unit tests
        working-directory: ./tests
        run: |
          python -m nose2 -s unit --plugin nose2.plugins.junitxml --junit-xml --junit-xml-path=unit_py${{ matrix.python-version }}_${{ runner.os }}_testreport.xml
        # run unit tests even if smoke tests fail
        if: success() || failure()
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.os }}
          path: ./tests/*.xml
          if-no-files-found: ignore

  report:
    needs: test
    if: success() || failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish test reports
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "*_testreport.xml"