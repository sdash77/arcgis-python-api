name: Unit Test
on:
  pull_request:
  schedule:
    # every Monday at 4:30 AM Pacific/7:30 AM Eastern/12:30 PM UTC (all platforms, all python versions)
    - cron: '30 12 * * 1'
    # every other day at 12:30 PM UTC (Windows & Linux, Python 3.11)(Default supported platforms for ArcGIS Pro/Enterprise)
    - cron: '30 12 * * 0,2-6'
  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        description: Run unit tests on Linux?
        required: false
        default: true
      macos:
        type: boolean
        description: Run unit tests on macOS?
        required: false
        default: false
      windows:
        type: boolean
        description: Run unit tests on Windows?
        required: false
        default: false
      py39:
        type: boolean
        description: Run unit tests on Python 3.9?
        required: false
        default: false
      py310:
        type: boolean
        description: Run unit tests on Python 3.10?
        required: false
        default: false
      py311:
        type: boolean
        description: Run unit tests on Python 3.11?
        required: false
        default: true

jobs:
  preflight:
    name: Run preflight configuration
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run-tests: ${{ github.event_name != 'pull_request' || steps.changed-files.outputs.any_changed }}
    steps:
      - uses: tj-actions/changed-files@v41
        name: Check changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        with:
          files: |
            .github/workflows/*.yaml
            .github/workflows/*.yml
            environment.yml
            build/arcgis/meta.yaml
            src/**/*.*
            tests/smoke/**/*.*
            tests/unit/**/*.*
            tests/utils/**/*.*
      - name: Get parameters or defaults
        id: get-parameters
        # defaults to running linux and python 3.11 on pull requests
        # defaults to running all platforms and python versions on Monday schedule
        # uses inputs to determine which platforms and python versions to run on for workflow_dispatch
        run: |
          echo "linux=${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.inputs.linux }}" >> $GITHUB_OUTPUT
          echo "macos=${{ (github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1') || github.event.inputs.macos }}" >> $GITHUB_OUTPUT
          echo "windows=${{ github.event_name == 'schedule' || github.event.inputs.windows }}" >> $GITHUB_OUTPUT
          echo "py39=${{ (github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1') || github.event.inputs.py39 }}" >> $GITHUB_OUTPUT
          echo "py310=${{ (github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1') || github.event.inputs.py310 }}" >> $GITHUB_OUTPUT
          echo "py311=${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event.inputs.py311 }}" >> $GITHUB_OUTPUT
      - name: Construct matrix
        id: set-matrix
        run: |
          matrix=$(echo {} | jq '. |= {"os": [], "python_version": []}' | jq -r tostring)
          if [ "${{ steps.get-parameters.outputs.linux }}" = 'true' ]; then
            echo "Running on Linux"
            matrix=$(echo $matrix | jq '.os |= ["ubuntu-latest"]' | jq -r tostring)
          fi
          if [ "${{ steps.get-parameters.outputs.macos }}" = 'true' ]; then
            echo "Running on macOS"
            matrix=$(echo $matrix | jq '.os |= ["macos-latest"]' | jq -r tostring)
          fi
          if [ "${{ steps.get-parameters.outputs.windows }}" = 'true' ]; then
            echo "Running on Windows"
            matrix=$(echo $matrix | jq '.os |= ["windows-latest"]' | jq -r tostring)
          fi
          if [ "${{ steps.get-parameters.outputs.py39 }}" = 'true' ]; then
            echo "Running on Python 3.9"
            matrix=$(echo $matrix | jq '.python_version |= ["3.9"]' | jq -r tostring)
          fi
          if [ "${{ steps.get-parameters.outputs.py310 }}" == 'true' ]; then
            echo "Running on Python 3.10"
            matrix=$(echo $matrix | jq '.python_version |= ["3.10"]' | jq -r tostring)
          fi
          if [ "${{ steps.get-parameters.outputs.py311 }}" == 'true' ]; then
            echo "Running on Python 3.11"
            matrix=$(echo $matrix | jq '.python_version |= ["3.11"]' | jq -r tostring)
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
  test:
    name: Run unit tests on ${{ matrix.os }} with Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [preflight]
    if: needs.preflight.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.preflight.outputs.matrix)}}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout code
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      - name: Checkout binaries
        uses: actions/checkout@v4
        with:
          ref: binaries/main
          path: binaries
      - name: Configure conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python_version }}
      - name: Get conda environment path
        id: conda-info
        run: |
          echo "conda-env-path=$CONDA_PREFIX" >> $GITHUB_OUTPUT
      - name: Get arcgis release info
        id: arcgis-info
        run: |
          echo "latest-version=$(conda search -c esri arcgis --json | jq -r '[ .[][].version] | max')" >> $GITHUB_OUTPUT
      - name: Load Cache
        id: restore-cache
        uses: actions/cache/restore@v3
        with:
          path: ${{ steps.conda-info.outputs.conda-env-path }}
          key: conda-${{ matrix.os }}-py${{ matrix.python_version }}-arcgis${{ steps.arcgis-info.outputs.latest-version }}-${{ hashFiles('.github/workflows/unit-test.yaml', 'environment.yml', 'build/arcgis/meta.yaml', 'src/requirements.txt', 'src/setup.py') }}
          restore-keys: |
            conda-${{ matrix.os }}-py${{ matrix.python_version }}-arcgis${{ steps.arcgis-info.outputs.latest-version }}-
      - name: Install dependencies
        run: |
          conda install -c main nose2 --yes
          conda install -c esri arcgis=${{ steps.arcgis-info.outputs.latest-version }} --only-deps --yes
          conda install -c esri "pandas>=2.0,<2.1" # See https://github.com/ArcGIS/geosaurus/issues/10966
          conda install -c esri-build pydantic --yes
          conda install -c esri-build puremagic --yes
          conda install -c main "pyarrow>=11" --yes
        if: steps.restore-cache.outputs.cache-hit != 'true'
      - name: Show conda environment
        run: |
          conda list
          conda info
      - name: Save Cache
        id: save-cache
        uses: actions/cache/save@v3
        with:
          path: ${{ steps.conda-info.outputs.conda-env-path }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
        if: steps.restore-cache.outputs.cache-hit != 'true'
      - name: Copy binary dependencies
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cp ./binaries/linux/py${{ matrix.python_version }}/graph/* ./src/arcgis/graph
          cp ./binaries/linux/py${{ matrix.python_version }}/knn/* ./src/arcgis/learn/_utils
          cp ./binaries/linux/py${{ matrix.python_version }}/tracking-engine/* ./src/arcgis/learn/_tracking
      - name: Copy binary dependencies
        if: runner.os == 'Windows'
        run: |
          cp ./binaries/windows/py${{ matrix.python_version }}/graph/* ./src/arcgis/graph
          cp ./binaries/windows/py${{ matrix.python_version }}/knn/* ./src/arcgis/learn/_utils
          cp ./binaries/windows/py${{ matrix.python_version }}/tracking-engine/* ./src/arcgis/learn/_tracking
      - name: Install arcgis
        run: |
          python -m pip install -e ./src --no-deps
      - name: Run smoke tests
        working-directory: ./tests
        run: |
          python -m nose2 -s smoke --plugin nose2.plugins.junitxml --junit-xml --junit-xml-path=smoke_py${{ matrix.python_version }}_${{ runner.os }}_testreport.xml
        env:
          TEST_ARCGIS_LEARN: false
      - name: Run unit tests
        working-directory: ./tests
        run: |
          python -m nose2 -s unit --plugin nose2.plugins.junitxml --junit-xml --junit-xml-path=unit_py${{ matrix.python_version }}_${{ runner.os }}_testreport.xml
        # always run unit tests, except for cancellation
        if: success() || failure()
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python_version }}-${{ matrix.os }}
          path: ./tests/*_testreport.xml
          if-no-files-found: ignore
          retention-days: 1
        # always upload test results, except for cancellation
        if: success() || failure()

  report:
    name: Publish test reports
    needs: test
    if: success() || failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Aggregate test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./*_testreport.xml
          if-no-files-found: ignore
      - name: Publish test reports
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "*_testreport.xml"