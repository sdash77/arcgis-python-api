about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: '0'
package:
  name: arcgis
  version: 1.6.2
channels:
- defaults
- anaconda
- conda-forge
requirements:
  build:
  - python
  - setuptools
  - six
  - notebook
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.23
  - numpy
  - matplotlib
  - keyring
  - pytest
  - pyshp <2
  - beautifulsoup4
  - requests
  - requests-kerberos >=0.11.0
  - requests-toolbelt
  - requests_ntlm
  - requests-oauthlib
  - winkerberos      [win]
  run:
  - python
  - six
  - notebook
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.23
  - numpy
  - matplotlib
  - keyring
  - pyshp <2
  - beautifulsoup4
  - requests
  - requests-kerberos >=0.11.0
  - requests-toolbelt
  - requests_ntlm
  - requests-oauthlib
  - winkerberos      [win]
source:
  path: ../../src
test:
  imports:
  - arcgis.gis
