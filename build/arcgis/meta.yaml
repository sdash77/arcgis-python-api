---
about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: {{ environ.get('BUILD_NUMBER', '0') }}
package:
  name: arcgis
  version: 2.4.1
requirements:
  build:
  - python
  - setuptools
  - requests
  run:
  - python
  - cachetools
  - certifi
  - cryptography
  - dask >=2023.3.2
  - geomet
  - keyring >=23.3.0
  - lxml
  - matplotlib
  - matplotlib-inline
  - numpy >=1.21.6,<2
  - pandas >=2.0.0,<2.3.0
  - pillow
  - puremagic >=1.15,<2
  - pyarrow >=11.0.0
  - pylerc
  - pyshp >=2,<3
  - pyspnego >=0.8.0
  - pywin32-security [win]
  - requests >=2.32.3,<3
  - requests-gssapi
  - requests-kerberos
  - requests-oauthlib
  - requests-toolbelt
  - truststore
  - ujson >=3
  - urllib3 >=2,<3
  - pydantic >=2.8.2, <3
  - websocket-client >=1.2.3, <2.0.0
source:
  git_url: ../..
test:
  imports:
  - arcgis.gis
extra:
  build_string: {{ GIT_BUILD_STR }}
