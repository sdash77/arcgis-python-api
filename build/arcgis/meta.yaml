about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: '0'
package:
  name: arcgis
  version: 1.8.0
requirements:
  build:
  - python
  - setuptools
  - six
  - notebook
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.25
  - numpy >=1.16.2
  - pyshp
  - matplotlib
  - keyring >=19
  - pytest
  - pyshp >=2
  - requests
  - requests-toolbelt
  - requests-kerberos
  - requests-oauthlib
  - requests_ntlm
  - lerc
  - winkerberos      [win]
  run:
  - python
  - six
  - notebook
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.25
  - numpy >=1.16.2
  - pyshp >=2
  - matplotlib
  - keyring >=19
  - pyshp
  - requests
  - requests-toolbelt
  - requests-kerberos
  - requests-oauthlib
  - requests_ntlm
  - lerc
  - winkerberos      [win]
source:
  path: ../../src
test:
  imports:
  - arcgis.gis
