about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: '0'
package:
  name: arcgis
  version: 1.6.1
requirements:
  build:
  - python
  - setuptools
  - six
  - notebook
  - jupyterlab
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.23
  - numpy
  - pyshp
  - matplotlib
  - keyring
  - pytest
  - pyshp <2
  - winkerberos      [win]
  run:
  - python
  - six
  - notebook
  - jupyterlab
  - ipywidgets >=7
  - widgetsnbextension >=3
  - pandas >=0.23
  - numpy
  - pyshp
  - matplotlib
  - keyring
  - pyshp <2
  - winkerberos      [win]
source:
  path: ../../src
test:
  imports:
  - arcgis.gis
