---
about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: {{ environ.get('BUILD_NUMBER', '0') }}
package:
  name: arcgis
  version: 2.4.0
requirements:
  build:
  - python
  - setuptools
  run:
  - python
  - pillow
  - notebook
  - jupyter_client <=6.1.12
  - ipywidgets >=7,<8
  - widgetsnbextension >=3
  - pandas >=2.0.0,<2.2.0
  - numpy >=1.21.6,<2
  - pyshp >=2,<3
  - matplotlib
  - keyring >=23.3.0
  - puremagic >=1.15,<2
  - pylerc
  - lxml
  - dask >=2023.3.2
  - geomet
  - matplotlib-inline
  - pyarrow >=11.0.0
source:
  git_url: ../..
test:
  imports:
  - arcgis.gis
extra:
  build_string: {{ GIT_BUILD_STR }}
