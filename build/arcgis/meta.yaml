---
about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: {{ environ.get('BUILD_NUMBER', '0') }}
package:
  name: arcgis
  version: 2.4.2
requirements:
  build:
  - python
  - setuptools
  - requests
  run:
  - python
  - cachetools
  - certifi
  - cryptography
  - dask >=2024.12.1,<2025.1.0
  - geomet
  - keyring >=23.3.0
  - lxml
  - matplotlib
  - matplotlib-inline
  - numpy >=2.2.0,<3
  - pandas >=2.0.0,<2.3.0
  - pillow
  - puremagic >=1.15,<2
  - pyarrow >=16,<20
  - pylerc
  - pyspnego >=0.8.0
  - pywin32-security [win]
  - requests >=2.32.3,<3
  - requests-gssapi
  - requests-kerberos
  - requests-oauthlib
  - requests-toolbelt
  - truststore >=0.10.0
  - ujson >=3
  - urllib3 >=2.1.0,<3
  - pydantic >=2.8.2, <3
  - networkx >=3.3, <4
  - websocket-client >=1.2.3, <2.0.0
  test:
  - pip
source:
  path: ../..
test:
  commands:
    - pip check
  imports:
  - arcgis.gis
extra:
  build_string: {{ environ.get('GITHUB_SHA', 'manual_build') }}
