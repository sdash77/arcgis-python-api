---
about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: ArcGIS API for Python
build:
  number: '0'
package:
  name: arcgis
  version: 2.3.0a0+jupyterlab
requirements:
  build:
  - python
  - setuptools
  run:
  - python
  - urllib3 <2
  - pillow
  - cachetools
  - pandas >=2.0.0,<3
  - ujson >=3
  - numpy >=1.21.6
  - pyshp >=2,<3
  - matplotlib
  - keyring >=23.3.0
  - requests >=2.27.1,<3
  - requests-toolbelt
  - requests-kerberos
  - requests-oauthlib
  - puremagic >=1.15,<2
  - pywin32-security [win]
  - pylerc
  - python-certifi-win32 [win and py<310]
  - truststore [py>=310]
  - cryptography
  - lxml
  - certifi
  - dask >=2023.3.2
  - geomet
  - requests-gssapi
  - pyspnego >=0.8.0
  - matplotlib-inline
  - pyarrow >=11.0.0
source:
  path: ../../src
test:
  imports:
  - arcgis.gis
