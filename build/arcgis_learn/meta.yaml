{% set name = "arcgis_learn" %}
{% set version = "2.3.0" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

build:
  number: 3

requirements:
  build:
    - python

  run:
    - arcgis>=2.2.0
    - boost=1.79 # [py>=39]
    - cairo 1.14.12
    - einops 0.3.2
    - ensemble-boxes 1.0.8
    - fairlearn=0.8.0
    - fastai=1.0.63
    - fastprogress=0.2.3
    - fasttext=0.9.2
    - gdal=3.4.1
    - graphviz
    - h3-py>=3.7.3
    - h5py=3.6.0 # [not win or py!=39]
    - h5py=3.6.0=py39h3de5c98_0 # [win and py==39]
    - inplace-abn
    - ipython<=7.21
    - jinja2=3.0.3
    - keras-gpu 2.7.*
    - laspy=1.7.0
    - libgdal=3.4.1=h82bb817_3 #[win]
    - libnetcdf 4.6.1 #[win]
    - libtiff=4.3.0
    - matplotlib==3.4.2 #[py==37 or not win]
    - matplotlib==3.6.0 #[py!=37 and win]
    - mljar-supervised==0.11.2
    - mmcls=0.25.0
    - mmcv-full=1.6.0
    - mmdet=2.27.0
    - mmdet3d=1.0.0rc5
    - mmengine=0.7.2
    - mmsegmentation=0.30.0
    - multi-scale-deformable-attention 1.0.0
    - nb_conda_kernels
    - nbconvert=6.4.4
    - networkx=2.8.4
    - notebook=6.4.2
    - onnx>=1.8.0
    - onnx-tf>=1.8.0
    - opencv=4.5.2
    - packaging=21.3
    - paddleocr=2.0.6
    - paddlepaddle-gpu=2.1.0
    - pandas=2.0.0
    - pillow=8.3.2
    - plotly=4.5.4
    - psutil
    - python
    - pytorch=1.8.2
    - python-graphviz=0.16.0
    - scikit-learn>=0.23.2
    - scikit-image=0.17.2
    - shap>=0.36.0
    - spacy=2.2.4
    - tensorboard >=2.3.0
    - tensorboardx=2.2
    - tensorflow-addons >=0.15.0
    - tensorflow-gpu=2.7.*
    - tflite-model-maker=0.3.4
    - timm=0.4.12
    - torch-cluster=1.5.9
    - torch-geometric=1.7.2
    - torch-scatter=2.0.7
    - torch-sparse=0.6.10
    - torch-spline-conv=1.2.1
    - torchvision=0.9.2
    - transformers=4.5.1

test:
  imports:
    - arcgis
    - cv2
    - einops
    - fastai
    - fastai.vision.image
    - fasttext
    - graphviz
    - h5py
    - keras
    - matplotlib.pyplot
    - mmcv
    - mmdet
    - mmdet3d
    - mmseg
    - onnx
    - onnx_tf
    - osgeo.gdal
    - osgeo.gdal_array
    - paddle
    - paddleocr
    - pandas
    - PIL.Image
    - plotly
    - shap
    - skimage
    - sklearn
    - spacy
    - tensorflow
    - tensorflow.keras
    - tensorflow_addons 
    - timm
    - torch
    - torchvision
    - torch_cluster
    - torch_geometric
    - torch_scatter
    - torch_sparse
    - torch_spline_conv
    - transformers

about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: A Metapackage to simplify installation of the required deep learning dependecies for ArcGIS Python API.