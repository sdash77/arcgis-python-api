{% set name = "arcgis_learn" %}
{% set version = "2.0.0" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

build:
  number: 9

requirements:
  build:
    - python

  run:
    - arcgis>=2.0.0
    - boost=1.73
    - einops 0.3.2
    - ensemble-boxes 1.0.8
    - fastai=1.0.63
    - fastprogress=0.2.3
    - fasttext=0.9.2
    - gdal=3.4.1
    - graphviz=
    - inplace-abn
    - laspy=1.7.0
    - libgdal=3.4.1=h82bb817_3 #[win]
    - libnetcdf 4.6.1 #[win]
    - libtiff=4.3.0
    - matplotlib>=3.4.2
    - mljar-supervised>=0.10.6
    - mmcv-full=1.4.0
    - mmdet=2.19.0
    - mmdet3d=0.17.3
    - mmsegmentation=0.19.0
    - nb_conda_kernels
    - notebook
    - onnx>=1.8.0
    - onnx-tf>=1.8.0
    - opencv=4.5.2
    - paddleocr=2.0.6
    - paddlepaddle-gpu=2.1.0
    - pillow=8.3.2
    - plotly=4.5.4
    - python
    - pytorch=1.8.2
    - scikit-learn>=0.23.2,<1
    - scikit-image=0.17.2
    - shap>=0.36.0
    - spacy=2.2.4
    - tensorboardx=2.2
    - tensorflow-gpu=2.7.*
    - timm=0.4.12
    - torch-cluster=1.5.9
    - torch-geometric=1.7.2
    - torch-scatter=2.0.7
    - torch-sparse=0.6.10
    - torch-spline-conv=1.2.1
    - torchvision=0.9.2
    - transformers=4.5.1

test:
  imports:
    - arcgis
    - cv2
    - PIL.Image
    - fastai
    - matplotlib.pyplot
    - mmdet
    - mmdet3d
    - mmseg
    - onnx
    - osgeo.gdal
    - osgeo.gdal_array
    - skimage
    - sklearn
    - torch
    - torchvision
    - tensorflow

about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: A Metapackage to simplify installation of the required deep learning dependecies for ArcGIS Python API.

