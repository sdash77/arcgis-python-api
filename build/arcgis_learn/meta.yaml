{% set name = "arcgis_learn" %}
{% set version = "2.0.0" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

build:
  number: 6

requirements:
  build:
    - python

  run:
    - arcgis>=1.9.1
    - boost 1.73
    - fastai=1.0.63
    - fastprogress=0.2.3
    - fasttext=0.9.2
    - gdal 3.0.2
    - graphviz=2
    - h5py=2.10.0
    - keras-gpu=2.4.3
    - laspy=1.7.0
    - libgdal 3.0.2 h955fff2_0 #[win]
    - libgdal 3.0.2 #[not win]
    - libtiff=4.3.0
    - mljar-supervised>=0.10.6
    - mmcv-full=1.3.7
    - mmdet=2.13.0
    - mmsegmentation=0.14.1
    - nb_conda_kernels
    - onnx>=1.8.0
    - onnx-tf=1.8.0
    - opencv=4.5.2
    - paddleocr=2.0.6
    - paddlepaddle-gpu=2.1.0
    - pillow-simd=8.3.1
    - plotly=4.5.4
    - python
    - pytorch=1.8.2
    - scikit-learn>=0.23.2
    - scikit-image=0.17.2
    - shap>=0.36.0
    - spacy=2.2.4
    - tensorboardx=2.2
    - tensorflow-gpu=2.5.0
    - torch-cluster=1.5.9
    - torch-geometric=1.7.2
    - torch-scatter=2.0.7
    - torch-sparse=0.6.10
    - torch-spline-conv=1.2.1
    - torchvision=0.9.2
    - transformers=4.5.1

test:
  imports:
    - arcgis
    - osgeo.gdal
    - PIL.Image
    - skimage
    - sklearn
    - fastai
    - torch
    - torchvision
    - tensorflow

about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: A Metapackage to simplify installation of the required deep learning dependecies for ArcGIS Python API.

extra:
  recipe-maintainers:
    - SandeepKumar
    - SurajBaloni
