{% set name = "arcgis_learn" %}
{% set version = "2.4.2" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

build:
  number: 3

requirements:
  build:
    - python

  run:
    - accelerate 0.33.*
    - arcgis >=2.4.2
    - boost 1.82.*
    - bitsandbytes 0.43.*
    - cudatoolkit 11.8.*
    - cudnn 8.7.*
    - detreg 1.0.0.*
    - einops 0.7.*
    - ensemble-boxes 1.0.8.*
    - fairlearn 0.8.0.*
    - fastai
    - fastprogress 0.2.3.*
    - fasttext
    - graphviz
    - gdal 3.8.* # [py<311 or linux]
    - gdal=3.8.3=py311_16 # [py==311 and win]
    - h3-py >=3.7.3
    - h5py # [linux or py==310]
    - h5py=3.9.0=py311h4e0e482_0 # [py==311 and win]
    - h5py=3.9.0=py39hfc34f40_0 # [py==39 and win]
    - imgaug >=0.4.0
    - inplace-abn
    - keras 2.13.*
    - laspy 1.7.1.*
    - libgdal 3.8.3.* # [win]
    - lerc # [linux]
    - lerc=3.0=hd77b12b_0 # [win]
    - libxml2=2.10.4=h0ad7f3c_1 # [win]
    - libcurl 8.5.* # [win]
    - matplotlib >=3.8 # [win]
    - matplotlib >=3.6 # [linux]
    - mljar-supervised 0.11.2.* 
    - mmcv 2.0.1.*
    - mmdet 3.1.0.*
    - mmdet3d 1.2.0.*
    - mmengine 0.8.5.*
    - mmsegmentation 1.1.2.*
    - numpy >=1.26.4
    - opencv=4.8.1=py311_cuda11.8_cudnn8.7_2 # [py==311 and win]
    - opencv 4.8.* # [linux]
    - opencv 4.9.* # [py<311 and win]
    - openpyxl
    - onnx
    - onnxruntime
    - onnx-tf >=1.9
    - pandas >=2.0.0
    - pillow >=8.3.2
    - plotly
    - psutil
    - python
    - python-graphviz
    - pytorch 2.0.1.*
    - scipy 1.14.1.*
    - scikit-image
    - scikit-learn >=1.0.0
    - shap >=0.36.0
    - spacy >=3.5
    - spconv 2.3.6
    - tensorboard 2.13.*
    - tensorboardX 2.6.*
    - tensorflow 2.13.* 
    - tensorflow-addons >=0.22.0
    - timm 0.4.12.*
    - torchvision 0.15.*
    - torch-cluster 1.6.3.*
    - torch-geometric 2.4.0.*
    - torch-scatter 2.1.2.*
    - torch-sparse 0.6.18.* 
    - torch-spline-conv 1.2.2.*
    - tflite-model-maker 0.3.4.*
    - transformers >=4.43.0

test:
  imports:
    - arcgis
    - einops
    - cv2
    - fairlearn
    - fastai
    - fastai.vision.image
    - fastprogress
    - fasttext
    - graphviz
    - h3
    - h5py
    - matplotlib.pyplot
    - mmcv
    - mmdet
    - mmdet3d
    - mmseg
    - numpy
    - onnx
    - onnxruntime
    - onnx_tf
    - osgeo.gdal
    - osgeo.gdal_array
    - pandas
    - PIL.Image
    - plotly
    - psutil
    - shap
    - skimage
    - sklearn
    - spacy
    - spconv
    - supervised
    - tensorboard
    - tensorboardX
    - tensorflow
    - tensorflow.keras
    - tensorflow_addons
    - timm
    - torch
    - torchvision
    - torch_cluster
    - torch_geometric
    - torch_scatter
    - torch_sparse
    - torch_spline_conv
    - tflite_model_maker
    - transformers

about:
  home: https://developers.arcgis.com/python
  license: Esri Master License Agreement (MLA)
  summary: A Metapackage to simplify installation of the required deep learning dependecies for ArcGIS Python API.